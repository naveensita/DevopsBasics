trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

steps:
  # 1. Build and package the Java application using Maven
  - task: Maven@3
    displayName: 'Build and Package with Maven'
    inputs:
      mavenPomFile: 'pom.xml'
      mavenOptions: '-Xmx3072m'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.11'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      goals: 'package'

  # 2. Authenticate to Docker Hub using your service connection
  - task: Docker@2
    displayName: 'Login to Docker Hub'
    inputs:
      containerRegistry: 'dock1'
      command: 'login'

  # 3. Build the Docker image and push to your repository
  - task: Docker@2
    displayName: 'Build and Push Docker Image'
    inputs:
      containerRegistry: 'dock1'
      repository: 'naveensita/naveen-sita'
      command: 'buildAndPush'
      Dockerfile: '**/AzureDockerfile'